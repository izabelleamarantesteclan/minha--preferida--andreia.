
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Blog</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f9;
        }

        header {
            background-color: #183C63;
            color: white;
            text-align: center;
            max-width: 1200px;
            margin: auto;
            padding: 40px;
            border-radius: 0 0 10px 10px;
        }

        main {
            background-color: white;
            color: #183C63;
            display: flex;
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            gap: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        img {
            width: 220px;
            height: 220px;
            object-fit: cover;
            border-radius: 8px;
        }

        .artigo-autor {
            font-weight: bold;
            color: #555;
        }

        .reacoes {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        .reacoes button {
            background-color: #f0f2f5;
            border: 2px solid transparent;
            border-radius: 20px;
            padding: 10px 15px;
            cursor: pointer;
            font-size: 17px;
            transition: 0.2s;
        }

        .reacoes button:hover {
            background-color: #dce8f5;
            transform: scale(1.08);
        }

        .reacoes button.ativo {
            background-color: #d5e7ff;
            border-color: #183C63;
        }

        @media (max-width: 600px) {
            main {
                flex-direction: column;
                margin: 15px;
            }

            img {
                width: 100%;
                height: 220px;
            }

            header {
                padding: 25px 10px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Programa</h1>
        <p>Compartilhando conhecimentos sobre programação e tecnologia</p>
    </header>

    <main>
        <img src="robotica.png" alt="Imagem sobre robótica">

        <div>
            <h2>Meu primeiro post</h2>

            <p class="artigo-autor">Por: Amarante Steclan</p>

            <p>
                Boas-vindas! Aqui vou compartilhar dicas de
                programação e curiosidades da área de tecnologia.
            </p>

            <h3>O que você achou da publicação?</h3>

            <div class="reacoes">

                <button data-reacao="curtir">
                    👍 <span>0</span>
                </button>

                <button data-reacao="amei">
                    ❤️ <span>0</span>
                </button>

                <button data-reacao="engracado">
                    😂 <span>0</span>
                </button>

                <button data-reacao="surpreso">
                    😮 <span>0</span>
                </button>

                <button data-reacao="triste">
                    😢 <span>0</span>
                </button>

            </div>
        </div>
    </main>

    <script>
        const botoes = document.querySelectorAll(".reacoes button");

        let minhaReacao = null;

        botoes.forEach(function(botao) {

            botao.addEventListener("click", function() {

                const reacao = botao.dataset.reacao;
                const contador = botao.querySelector("span");

                // Clicou novamente na mesma reação
                if (minhaReacao === reacao) {
                    contador.textContent =
                        Number(contador.textContent) - 1;

                    botao.classList.remove("ativo");
                    minhaReacao = null;
                    return;
                }

                // Remove a reação anterior
                if (minhaReacao !== null) {
                    const anterior = document.querySelector(
                        `[data-reacao="${minhaReacao}"]`
                    );

                    const contadorAnterior =
                        anterior.querySelector("span");

                    contadorAnterior.textContent =
                        Number(contadorAnterior.textContent) - 1;

                    anterior.classList.remove("ativo");
                }

                // Adiciona a nova reação
                contador.textContent =
                    Number(contador.textContent) + 1;

                botao.classList.add("ativo");
                minhaReacao = reacao;

            });

        });
    </script>

</body>
</html>
